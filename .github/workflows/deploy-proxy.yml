name: Deploy proxy

# Stage 8 (docs/DEVELOPMENT_PLAN.md): apps/proxy runs as a single Docker
# container on the user's own VPS. This deploys it over SSH rather than
# passing VPS credentials through chat or committing them anywhere — see
# docs/VPS_DEPLOY.md for the one-time VPS setup and the GitHub Actions
# secrets this workflow needs.

on:
  push:
    branches: [main]
    paths:
      - 'apps/proxy/**'
      - 'packages/shared/**'
      - 'packages/onet-mnm-client/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-proxy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy apps/proxy to the VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f apps/proxy/docker-compose.yml up -d --build
            docker image prune -f
